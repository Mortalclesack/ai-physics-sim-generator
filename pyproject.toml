[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-physics-sim-generator"
version = "0.9.4"
description = "AI-driven physics simulation generator: prompt/spec -> runnable sim -> exportable artifact."
readme = "docs/overview.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "apsim-gen maintainers" }]
keywords = ["physics", "simulation", "generator", "pipeline", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "tomli>=2.0; python_version<'3.11'",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
export = [
  "trimesh>=4.4",
  "imageio-ffmpeg>=0.5",
]
native = []

[project.scripts]
apsim-gen = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
markers = ["integration: end-to-end pipeline runs (slow)"]
testpaths = ["tests"]